<style>
/* Layout: calm mobile app shell — soft surfaces on a tinted ground, one accent, phase colour used only as small markers. */
:root{
  --bg:#F5F4F7; --surface:#FFFFFF; --surface-2:#F1EFF4; --ink:#1C1A22; --muted:#6F6B7A; --line:#ECE9F0;
  --accent:#5E45A6; --accent-ink:#FFFFFF; --accent-soft:#EEEAF7;
  --p1:#4A8A6C; --p2:#3F6EAD; --p3:#A6456F; --p4:#B07224;
  --good:#2F8455; --warn:#A8701A; --bad:#B9433C;
  --skin:#E2B497; --skin-far:#C49479; --hair:#3D2B22; --top:#40395A; --top-far:#5F5878; --leg:#2A2732; --leg-far:#4B4757; --shoe:#8D879A;
  --sole:#F6F4F8; --prop:#9A94A6; --prop-d:#5F596B; --pad:#4A4458; --box:#D9CDBB; --floor:#E8E5EC; --stage:#FBFAFC; --stage-2:#F1EFF5; --shadow:rgb(30 22 45 / .12);
  --card-shadow:0 1px 2px rgb(30 22 45 / .04),0 6px 20px rgb(30 22 45 / .05);
  --f-display:"Archivo",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-body:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"Instrument Sans",system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#131118; --surface:#1C1A22; --surface-2:#25222D; --ink:#EDEAF3; --muted:#A39FAE; --line:#2B2833;
  --accent:#B4A1EE; --accent-ink:#17131F; --accent-soft:#2A2440;
  --p1:#7BC09F; --p2:#86AAE3; --p3:#E28AB2; --p4:#E4AD5F;
  --good:#6FC793; --warn:#E2B261; --bad:#EE837B;
  --skin:#D6A687; --skin-far:#9E7B66; --hair:#6B4C3C; --top:#7569A8; --top-far:#4E4672; --leg:#5A5568; --leg-far:#3B3846; --shoe:#B9B3C4;
  --sole:#D9D4E0; --prop:#8B8597; --prop-d:#B3ADBE; --pad:#4E4860; --box:#5A4F42; --floor:#2A2632; --stage:#211E28; --stage-2:#1A1820; --shadow:rgb(0 0 0 / .35);
  --card-shadow:none; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#131118; --surface:#1C1A22; --surface-2:#25222D; --ink:#EDEAF3; --muted:#A39FAE; --line:#2B2833;
  --accent:#B4A1EE; --accent-ink:#17131F; --accent-soft:#2A2440;
  --p1:#7BC09F; --p2:#86AAE3; --p3:#E28AB2; --p4:#E4AD5F;
  --good:#6FC793; --warn:#E2B261; --bad:#EE837B;
  --skin:#D6A687; --skin-far:#9E7B66; --hair:#6B4C3C; --top:#7569A8; --top-far:#4E4672; --leg:#5A5568; --leg-far:#3B3846; --shoe:#B9B3C4;
  --sole:#D9D4E0; --prop:#8B8597; --prop-d:#B3ADBE; --pad:#4E4860; --box:#5A4F42; --floor:#2A2632; --stage:#211E28; --stage-2:#1A1820; --shadow:rgb(0 0 0 / .35);
  --card-shadow:none; color-scheme:dark;}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums;
  padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));padding-block:0 calc(96px + env(safe-area-inset-bottom,0px))}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:left}
button:focus-visible,a:focus-visible,summary:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:10px}
.wrap{max-width:540px;margin:0 auto}
/* header */
.hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);margin:0 calc(-1*max(18px,env(safe-area-inset-left,0px)));padding:12px max(18px,env(safe-area-inset-right,0px)) 12px max(18px,env(safe-area-inset-left,0px));display:flex;align-items:center;gap:10px;min-height:60px;border-bottom:1px solid transparent;transition:border-color .2s}
.hdr.scrolled{border-bottom-color:var(--line)}
.hdr .mark{font-family:var(--f-display);font-weight:700;font-size:19px;letter-spacing:-.01em}
.hdr .mark i{font-style:normal;color:var(--accent)}
.hdr .ctx{font-size:12.5px;color:var(--muted);margin-left:auto;text-align:right;line-height:1.3}
.iconbtn{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--surface);box-shadow:var(--card-shadow);flex:none}
.iconbtn svg{width:18px;height:18px;stroke:var(--ink);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.crumb{font-size:14px;font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* type */
.eyebrow{font-size:12.5px;font-weight:600;color:var(--muted)}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0}
h1{font-weight:700;font-size:clamp(28px,7.6vw,34px);line-height:1.08;letter-spacing:-.02em}
h2{font-weight:700;font-size:20px;line-height:1.2;letter-spacing:-.01em}
h3{font-weight:650;font-size:16.5px;line-height:1.25}
p{margin:0}
.muted{color:var(--muted)}
.mono{font-variant-numeric:tabular-nums}
.stack{display:flex;flex-direction:column;gap:12px}
.sec{display:flex;flex-direction:column;gap:10px;margin-top:30px}
.sec>.eyebrow{display:flex;justify-content:space-between;align-items:baseline;padding:0 2px}
/* cards */
.card{background:var(--surface);border-radius:20px;padding:18px;box-shadow:var(--card-shadow)}
.tap{display:block;width:100%;transition:transform .12s ease}
.tap:active{transform:scale(.985)}
.chev{width:16px;height:16px;stroke:var(--muted);fill:none;stroke-width:2.2;flex:none;opacity:.7}
.row{display:flex;align-items:center;gap:12px;min-width:0}
.row>.grow{flex:1;min-width:0}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:12px;font-weight:550;padding:4px 10px;border-radius:999px;background:var(--surface-2);color:var(--ink);white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;flex:none}
/* hero */
.hero{margin-top:10px;display:flex;flex-direction:column;gap:16px}
.ppnum{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap}
.ppnum .big{font-family:var(--f-display);font-weight:700;font-size:clamp(48px,14vw,60px);line-height:.9;letter-spacing:-.04em}
.ppnum .big small{font-size:.4em;font-weight:600;letter-spacing:0;margin:0 6px 0 2px;color:var(--muted)}
.ppnum .side{padding-bottom:4px;font-size:14px;color:var(--muted);line-height:1.4}
.timeline{display:grid;grid-template-columns:repeat(16,1fr);gap:3px}
.timeline .w{height:6px;border-radius:3px;background:var(--line)}
.timeline .w.fill{background:var(--pc)}
.timeline .w.now{background:var(--pc);box-shadow:0 0 0 2px var(--bg),0 0 0 3.5px var(--pc)}
.tl-labels{display:grid;grid-template-columns:repeat(4,1fr);gap:3px;margin-top:8px}
.tl-labels span{font-size:11.5px;color:var(--muted);display:flex;align-items:center;gap:5px}
.tl-labels span::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--pc);flex:none}
/* traffic light */
.tl3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tl3 button{background:var(--surface);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:3px;box-shadow:var(--card-shadow);border:1.5px solid transparent}
.tl3 button b{font-size:14.5px;font-weight:650;display:flex;align-items:center;gap:7px}
.tl3 button span{font-size:12px;color:var(--muted);line-height:1.3}
.tl3 button[aria-pressed="true"]{border-color:var(--c);background:color-mix(in srgb,var(--c) 7%,var(--surface))}
.note{border-radius:16px;padding:13px 15px;background:var(--surface-2);font-size:14px;line-height:1.45}
.note.warn{background:color-mix(in srgb,var(--warn) 11%,var(--surface))}
.note.bad{background:color-mix(in srgb,var(--bad) 10%,var(--surface))}
.note.good{background:color-mix(in srgb,var(--good) 10%,var(--surface))}
.note b{font-weight:650}
/* next session */
.next{background:var(--surface);box-shadow:var(--card-shadow);border-radius:22px;padding:20px;display:flex;flex-direction:column;gap:10px;position:relative;overflow:hidden}
.next::before{content:"";position:absolute;inset:0 auto 0 0;width:4px;background:var(--pc)}
.next .eyebrow{color:var(--pc)}
.next h2{font-size:24px}
.next .meta{font-size:13px;color:var(--muted)}
.next .go{display:inline-flex;align-items:center;gap:6px;background:var(--ink);color:var(--bg);font-weight:600;border-radius:999px;padding:9px 16px;align-self:flex-start;font-size:14px;margin-top:4px}
.next .go .chev{stroke:var(--bg);opacity:1}
.next svg.bgmark{display:none}
/* list rows */
.list{background:var(--surface);border-radius:20px;overflow:hidden;box-shadow:var(--card-shadow)}
.list>*{position:relative}
.list>*+*::before{content:"";position:absolute;top:0;left:16px;right:16px;height:1px;background:var(--line)}
.li{display:flex;align-items:center;gap:13px;padding:13px 16px;width:100%;min-width:0}
.li .grow{flex:1;min-width:0}
.li .t{display:block;font-weight:600;line-height:1.3}
.li .s{display:block;font-size:13px;color:var(--muted);line-height:1.35;margin-top:1px}
.li .rx{font-size:13.5px;font-weight:650;white-space:nowrap;text-align:right}
.thumb{width:58px;height:42px;border-radius:12px;background:var(--stage);flex:none;display:block}
.status{width:24px;height:24px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;flex:none}
.status.done{background:var(--good);border-color:var(--good)}
.status svg{width:13px;height:13px;stroke:var(--surface);stroke-width:3;fill:none}
.block-h{display:flex;justify-content:space-between;align-items:baseline;padding:14px 16px 4px}
.block-h .eyebrow{color:var(--ink);font-size:13px}
.list>.block-h+*::before{display:none}
.list>.block-h::before{left:0;right:0}
/* phase cards */
.phase{display:flex;flex-direction:column;gap:10px}
.phase .num{font-size:12.5px;font-weight:600;color:var(--pc);display:flex;align-items:center;gap:6px}
.phase .num::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--pc)}
.wkgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.wk{border-radius:16px;padding:11px;background:var(--surface);box-shadow:var(--card-shadow);display:flex;flex-direction:column;gap:5px;min-width:0;border:1.5px solid transparent}
.wk.now{border-color:var(--pc)}
.wk .n{font-family:var(--f-display);font-weight:700;font-size:17px;line-height:1}
.wk .d{font-size:11px;color:var(--muted)}
.pips{display:flex;gap:4px}
.pip{width:7px;height:7px;border-radius:50%;background:var(--line)}
.pip.on{background:var(--pc)}
/* page heading (was a colour band) */
.band{padding:8px 2px 4px;display:flex;flex-direction:column;gap:8px}
.band .eyebrow{color:var(--pc);display:flex;align-items:center;gap:6px}
.band .eyebrow::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--pc)}
.band h1{font-size:clamp(30px,8.4vw,38px)}
.band p{color:var(--muted);max-width:62ch}
.kv{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1px;background:var(--line);border-radius:18px;overflow:hidden;box-shadow:var(--card-shadow)}
.kv div{background:var(--surface);padding:12px 14px;min-width:0}
.kv b{display:block;font-size:12px;color:var(--muted);font-weight:500}
.kv span{font-weight:600;font-size:14.5px}
ul.clean{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:9px}
ul.clean li{display:flex;gap:11px;align-items:flex-start}
ul.clean li::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--pc,var(--accent));margin-top:9px;flex:none}
ol.steps{margin:0;padding:0;list-style:none;counter-reset:s;display:flex;flex-direction:column;gap:12px}
ol.steps li{counter-increment:s;display:flex;gap:12px}
ol.steps li::before{content:counter(s);font-weight:650;font-size:12px;width:22px;height:22px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;flex:none;margin-top:1px}
/* segmented */
.seg{display:flex;background:var(--surface-2);border-radius:14px;padding:3px;gap:2px;overflow-x:auto}
.seg button{flex:1;padding:8px 10px;border-radius:11px;font-size:13px;font-weight:550;text-align:center;white-space:nowrap;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);font-weight:650;box-shadow:0 1px 3px rgb(0 0 0 / .08)}
/* stage */
.stage{background:var(--stage);border-radius:24px;overflow:hidden;position:relative;box-shadow:var(--card-shadow)}
.stage canvas{display:block;width:100%;height:auto;aspect-ratio:320/220;max-width:100%}
.stagebar{display:flex;align-items:center;gap:8px;padding:12px 14px;background:var(--surface)}
.cue{flex:1;min-width:0;font-size:14px;font-weight:600;line-height:1.3}
.cue small{display:block;font-weight:450;font-size:12px;color:var(--muted);margin-top:1px}
.ctl{height:36px;min-width:36px;padding:0 11px;border-radius:999px;background:var(--surface-2);display:grid;place-items:center;font-size:12.5px;font-weight:650}
.ctl svg{width:14px;height:14px;fill:var(--ink)}
.stage .tag{display:none}
.stepdots{display:flex;gap:4px;position:absolute;top:14px;left:16px}
.stepdots i{width:14px;height:3px;border-radius:2px;background:var(--line)}
.stepdots i.on{background:var(--accent)}
/* rx box */
.rx-box{display:flex;flex-direction:column;gap:10px;border-radius:20px;padding:16px 18px;background:var(--surface);box-shadow:var(--card-shadow)}
.rx-box .eyebrow{color:var(--pc,var(--accent))}
.rx-big{font-family:var(--f-display);font-weight:700;font-size:28px;line-height:1;letter-spacing:-.02em}
.prog{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.prog div{font-size:12px;font-weight:550;text-align:center;padding:7px 2px;border-radius:11px;background:var(--surface-2);min-width:0;overflow-wrap:anywhere}
.prog div.on{background:var(--ink);color:var(--bg)}
.prog div b{display:block;font-weight:500;opacity:.65;font-size:10.5px}
/* drill (details) */
details.drill{background:var(--surface);border-radius:18px;overflow:hidden;box-shadow:var(--card-shadow)}
details.drill>summary{list-style:none;display:flex;align-items:center;gap:13px;padding:14px 16px;cursor:pointer}
details.drill>summary::-webkit-details-marker{display:none}
details.drill>summary .ic{width:34px;height:34px;border-radius:50%;background:var(--accent-soft);display:grid;place-items:center;flex:none}
details.drill>summary .ic svg{width:16px;height:16px;stroke:var(--accent);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
details.drill>summary .grow{flex:1;min-width:0;line-height:1.3}
details.drill>summary b{font-weight:600}
details.drill>summary .s{font-size:12.5px;color:var(--muted)}
details.drill>summary .chev{transition:transform .2s}
details.drill[open]>summary .chev{transform:rotate(90deg)}
details.drill .body{padding:0 16px 18px 63px;display:flex;flex-direction:column;gap:12px}
@media (max-width:380px){details.drill .body{padding-left:16px}}
.linkrow{display:flex;align-items:center;gap:10px;padding:11px 13px;background:var(--surface-2);border-radius:14px;width:100%}
.linkrow .grow{flex:1;min-width:0;font-weight:600;font-size:14px}
.linkrow small{display:block;font-weight:400;color:var(--muted);font-size:12.5px}
.sec .linkrow{background:var(--surface);box-shadow:var(--card-shadow)}
/* article */
.article{display:flex;flex-direction:column;gap:14px;max-width:65ch}
.article h3{margin-top:12px}
.article p,.article li{font-size:15.5px;line-height:1.6}
.article ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.disclaimer{font-size:12.5px;color:var(--muted);border-top:1px solid var(--line);padding-top:12px;margin-top:8px}
/* forms */
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:13px;font-weight:600}
.field input[type=date],.field input[type=search],.field input[type=text]{font:inherit;padding:12px 14px;border-radius:14px;border:0;background:var(--surface);box-shadow:var(--card-shadow),inset 0 0 0 1px var(--line);color:var(--ink);width:100%}
.checks{display:flex;flex-wrap:wrap;gap:8px}
.checks label{display:flex;align-items:center;gap:8px;padding:9px 13px;border-radius:999px;background:var(--surface-2);font-size:14px;cursor:pointer}
.checks input{accent-color:var(--accent);width:16px;height:16px}
input[type=range]{width:100%;accent-color:var(--accent)}
.btn{display:flex;justify-content:center;align-items:center;gap:8px;width:100%;text-align:center;padding:15px;border-radius:999px;background:var(--ink);color:var(--bg);font-weight:650;font-size:15px}
.btn.ghost{background:var(--surface-2);color:var(--ink)}
.btn.ph{background:var(--ink);color:var(--bg)}
.filters{display:flex;gap:6px;overflow-x:auto;padding:2px 0;scrollbar-width:none}
.filters button{white-space:nowrap;font-size:13px;font-weight:550;padding:8px 13px;border-radius:999px;background:var(--surface);box-shadow:var(--card-shadow)}
.filters button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
/* tab bar */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:10;background:color-mix(in srgb,var(--surface) 90%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--line);
  padding:6px max(12px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
.tabs .in{max-width:540px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.tabs button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 4px;border-radius:14px;font-size:11.5px;font-weight:550;color:var(--muted)}
.tabs button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.tabs button[aria-current="true"]{color:var(--accent)}
.foot{margin-top:30px;font-size:12px;color:var(--muted);text-align:center}
.view{animation:in .22s ease both}
@keyframes in{from{opacity:.5;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.view{animation:none}.tap{transition:none}}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.two .card{padding:15px}
@media (max-width:360px){.tl3 button span{display:none}.two{grid-template-columns:1fr}}

.sh{font-family:var(--f-body);font-size:15px;font-weight:650;letter-spacing:0;display:flex;align-items:center;gap:8px;padding:0 2px}
.sh>span:last-child:not(.dot){margin-left:auto;font-size:13px;font-weight:500;color:var(--muted)}
.lbl{font-size:12.5px;font-weight:600;color:var(--muted)}
.pagehead{display:flex;flex-direction:column;gap:6px;padding:10px 2px 0}
.pagehead p{margin-top:4px;max-width:60ch}
.statuscard{margin-top:10px;display:flex;flex-direction:column;gap:14px}
.statuscard .big{font-family:var(--f-display);font-weight:700;font-size:40px;line-height:1;letter-spacing:-.03em;margin-top:4px}

const LEARN={
start:{t:'Before you start',s:'Check-ups, who this plan suits, when to adapt it',ic:'flag',html:`
<p>This plan starts around <b>12 weeks after birth</b> and assumes a straightforward recovery. Make sure these boxes are ticked first.</p>
<h3>Get the all-clear</h3>
<ul><li>Your routine postnatal check (usually at 6–8 weeks) with a GP or midwife.</li><li>Ideally, an assessment with a <b>pelvic health (women's health) physiotherapist</b>. They can check pelvic floor strength, the tummy gap and any prolapse, and tailor this plan to you.</li></ul>
<h3>Talk to a professional before following this plan if</h3>
<ul><li>You had a 3rd or 4th degree tear, or a complicated C-section.</li><li>You have been told you have a prolapse, or you have leaking, heaviness or pelvic pain now.</li><li>You have a large tummy gap that domes with everyday movements.</li><li>You had high blood pressure, heavy blood loss or anaemia around the birth.</li></ul>
<h3>How the plan works</h3>
<p>Four phases of four weeks. Each phase has a short <b>move-on list</b>. If you do not tick everything, repeat the last week or two. Slower is fine. Your body made a whole person.</p>`},
breath:{t:'Breathing & the core canister',s:'Why every exercise starts with the exhale',ic:'wind',html:`
<p>Think of your core as a canister. The <b>diaphragm</b> is the lid, the <b>pelvic floor</b> is the base, and the deep abdominal and back muscles are the walls. They share pressure.</p>
<p>Pregnancy stretches the walls and loads the base for months. Afterwards, pressure from lifting can push down and out instead of being shared, which can show up as leaking, heaviness or doming.</p>
<h3>The rule: exhale on effort</h3>
<ul><li>Start to breathe out <b>just before</b> the hard part of each rep: standing up, pushing, pulling.</li><li>As you exhale, gently lift the pelvic floor and let the lower belly draw in.</li><li>Inhale on the easier part (lowering).</li></ul>
<h3>Later: bracing</h3>
<p>For heavy barbell sets in phases 3–4, a short brace (breath held for a rep or two) is normal lifting technique. Only use it when lifts are symptom-free with the exhale strategy.</p>`},
pf:{t:'Pelvic floor basics',s:'Strength and relaxation, daily',ic:'circle',html:`
<p>The pelvic floor is a hammock of muscles from pubic bone to tailbone. It supports the bladder, bowel and uterus, and helps control leaks.</p>
<h3>Daily routine (about 5 minutes)</h3>
<ul><li><b>Long holds:</b> lift and hold up to 10 s, rest 5 s. Up to 10 reps.</li><li><b>Quick flicks:</b> 10 fast lifts, fully relaxing each time.</li><li>Three times a day early on. Then keep going three times a week for good.</li></ul>
<h3>Relaxing matters too</h3>
<p>A pelvic floor that is always clenched can cause pain and leaking too. Make sure each lift ends with a full let-go.</p>
<h3>If it is hard to feel</h3>
<p>Many women struggle to feel the muscles after birth. A pelvic health physio can check your technique, which makes a big difference.</p>`},
dr:{t:'Tummy gap (diastasis)',s:'What doming means and what to do',ic:'gap',html:`
<p>Almost everyone has some separation of the two halves of the "six-pack" muscle by late pregnancy. It often narrows a lot by itself in the first months.</p>
<h3>Quick self-check</h3>
<ul><li>Lie on your back, knees bent. Lift your head slightly.</li><li>Press your fingertips along the midline above and below the belly button.</li><li>Note the width (in fingers) and, more importantly, how <b>firm</b> it feels. Firm tension is a good sign even if a gap remains.</li></ul>
<h3>Doming or coning</h3>
<p>A ridge popping up along the midline during an exercise means the pressure is more than the wall can manage <i>right now</i>. Use the easier version of that exercise, or exhale earlier. It is a signal, not damage.</p>
<h3>Crunches and sit-ups</h3>
<p>They are not banned forever. Add them later once you control dead bugs and planks without doming.</p>`},
red:{t:'Stop signs',s:'When to stop, adapt, or get checked',ic:'alert',html:`
<p>Stop the session and adapt (go back a week, choose easier versions) if you notice:</p>
<ul><li>Leaking urine, wind or stool.</li><li>Heaviness, dragging or a bulge in the vagina.</li><li>Pain in the pelvis, pubic bone, lower back or scar.</li><li>Doming of the tummy you cannot control.</li><li>Bleeding that gets heavier or turns bright red again.</li></ul>
<p>If these happen repeatedly, see a pelvic health physio or your GP. These are common and treatable. They are not something you just have to live with.</p>
<h3>Get medical help urgently for</h3>
<ul><li>Heavy bleeding (soaking a pad in an hour).</li><li>Chest pain or sudden breathlessness.</li><li>A painful, swollen or hot calf.</li><li>Fever, or a red, hot or weeping wound.</li><li>Feeling faint or dizzy during exercise.</li></ul>`},
days:{t:'Green, amber, red days',s:'Training around broken sleep',ic:'traffic',html:`
<p>Sleep with a newborn is unpredictable. Instead of skipping, adjust the session to the day.</p>
<h3>Green</h3><p>Slept reasonably, feel OK. Do the session as written.</p>
<h3>Amber</h3><p>Rough night, sore, or low energy. Same exercises, <b>one set fewer</b> on each, and stop 1–2 reps earlier (RPE minus one). Short sessions still count.</p>
<h3>Red</h3><p>Very little sleep, unwell, or symptoms from last session. Swap the gym for a <b>20-minute walk</b> plus breathing and pelvic floor work. That is a completed day.</p>`},
feed:{t:'Feeding & training',s:'Breastfeeding, fuel and recovery',ic:'cup',html:`
<p>If you are breastfeeding:</p>
<ul><li>Feed or pump before the gym. It is more comfortable and you will train better.</li><li>Wear a supportive, high-impact sports bra.</li><li>Drink to thirst and have water with you. You need more fluid than usual.</li><li>Moderate exercise does not reduce milk supply in research so far.</li></ul>
<h3>Eat enough</h3>
<p>Recovery, sleep loss and feeding all cost energy. Aggressive dieting slows strength gains and can affect supply. Prioritise protein at each meal and regular snacks.</p>
<h3>Joints</h3>
<p>Hormonal changes after birth (and while feeding) can leave ligaments looser for a while. Keep movements controlled and avoid forcing end ranges in stretches.</p>`},
vag:{t:'After a vaginal birth',s:'Pelvic floor first, and what tears change',ic:'circle',html:`
<p>A vaginal birth stretches your pelvic floor a long way, and many women have a tear or stitches. Most women recover well with time and training, and so can you.</p>
<h3>What the plan does for you</h3>
<ul><li>Every session starts with a short pelvic floor block.</li><li>Kettlebell swings and pogo hops come with heaviness and leaking checks.</li><li>The move-on checks include pelvic floor targets before impact returns.</li></ul>
<h3>Tears and stitches</h3>
<ul><li>Stitches usually dissolve within a few weeks, but the area can stay tender for longer.</li><li>Pain at the tear during squats, lunges or carries means regress that exercise for now.</li><li>After a 3rd or 4th degree tear, see a pelvic health physio before following this plan.</li></ul>
<h3>Watch for</h3>
<ul><li>Heaviness, dragging or a bulge: possible signs of prolapse. Get checked, and avoid impact until then.</li><li>Leaking with coughing, lifting or jumping. Common and very treatable with a physio.</li></ul>`},
cs:{t:'After a C-section',s:'What changes in the plan',ic:'scar',html:`
<p>A caesarean is major abdominal surgery. The skin heals in weeks; deeper layers keep remodelling for months.</p>
<h3>What the plan does for you</h3>
<ul><li>Phase 1 lasts 5 weeks instead of 4, so the program is 17 weeks.</li><li>Planks are swapped for heel slides in phase 1 and done from the knees in phase 2.</li><li>Dead bugs stay at heel taps through phase 1.</li><li>A scar-care step joins the lower-body warm-up in phases 1–2, and tummy-loading exercises carry scar notes.</li></ul>
<h3>Good to know</h3>
<ul><li>Progress core exercises a little more slowly. Spend an extra week in phase 1 if anything pulls on the scar.</li><li>Once the scar is fully healed and you are cleared, gentle scar massage can help with tightness and numbness. A physio can show you how.</li><li>Numbness around the scar is common and often improves slowly.</li><li>Pain at the scar during an exercise means regress that exercise.</li></ul>
<p>The pelvic floor still needs training after a C-section. Pregnancy loads it whether or not you deliver vaginally.</p>`},
impact:{t:'Return-to-impact test',s:'Your gate to running and jumping',ic:'jump',html:`
<p>Based on the UK return-to-running guideline for postnatal women (Goom, Donnelly & Brockwell, 2019), which suggests impact from about <b>12 weeks</b> after birth if you pass these checks <b>without leaking, heaviness or pain</b>.</p>
<h3>Load and impact checks</h3>
<ul><li>Walk 30 minutes</li><li>Single-leg balance 10 s, each side</li><li>Single-leg squat 10 reps, each side</li><li>Jog on the spot 1 minute</li><li>Forward bounds 10</li><li>Hop on the spot 10, each leg</li><li>Single-leg "running man" 10, each side</li></ul>
<h3>Strength checks (reps each side)</h3>
<ul><li>Single-leg calf raise 20</li><li>Single-leg bridge 20</li><li>Single-leg sit-to-stand 20</li><li>Side-lying leg lift 20</li></ul>
<p>Pass everything: add pogo hops and swings, then walk–run intervals. Not yet: keep strengthening and retest in 2–3 weeks.</p>`},
rpe:{t:'Effort scale (RPE)',s:'How hard should it feel?',ic:'gauge',html:`
<p>RPE is effort out of 10. In lifting, it maps to how many more reps you could have done.</p>
<ul><li><b>RPE 5–6</b>: 4+ reps left. Phase 1.</li><li><b>RPE 7</b>: 3 reps left. Phase 2.</li><li><b>RPE 8</b>: 2 reps left. Phases 3–4.</li><li><b>RPE 9–10</b>: 0–1 left. Not needed in this plan.</li></ul>
<p>"3×10" means 3 sets of 10 reps. "/side" means each side. Rest 60–90 s between sets in phases 1–2 and 2 minutes on heavy barbell sets.</p>`},
load:{t:'How to add weight',s:'Simple progression rules',ic:'up',html:`
<p>Use <b>double progression</b>:</p>
<ul><li>Pick a weight you can lift for every set at the target effort.</li><li>When you hit the top of the rep range on every set with good form and no symptoms, add weight next time.</li><li>Lower body: +2–5 kg. Upper body: +1–2.5 kg (or the next dumbbell).</li></ul>
<p>Write down what you lift. Some weeks will go backwards because of sleep. That is normal; the trend over a month is what counts.</p>`}
};

let LOG=store.get('pp.log',{});

const DAY=864e5;
const pd=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const fmt=d=>d.toLocaleDateString('en-GB',{day:'numeric',month:'short'});
const todayD=()=>{const n=new Date();return new Date(n.getFullYear(),n.getMonth(),n.getDate())};
const iso=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const diff=(a,b)=>Math.round((b-a)/DAY);
const addD=(d,n)=>new Date(d.getTime()+n*DAY);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pc=n=>`--pc:var(--p${n})`;

/* ---------- birth-type tailoring ---------- */
const isCS=()=>SET.delivery==='cs', isVag=()=>SET.delivery==='vag';
const PLEN=()=>isCS()?[5,4,4,4]:[4,4,4,4];
const TOTAL=()=>PLEN().reduce((a,b)=>a+b,0);
const phStart=n=>1+PLEN().slice(0,n-1).reduce((a,b)=>a+b,0);
const phWeeks=n=>Array.from({length:PLEN()[n-1]},(_,i)=>phStart(n)+i);
const phaseOf=w=>{for(let n=4;n>=1;n--)if(w>=phStart(n))return PH[n-1];return PH[0]};
const wInPh=w=>w-phStart(phaseOf(w).n);
const wip=w=>Math.min(3,wInPh(w));
const weekNote=w=>wInPh(w)>3?'Extra C-section week. Repeat week 4 and make sure the scar feels comfortable in every exercise.':phaseOf(w).weeks[wInPh(w)];
const weekStart=w=>addD(pd(SET.start),(w-1)*7);
const ppWeekAt=d=>Math.floor(diff(pd(SET.birth),d)/7);
function curWeek(){const d=diff(pd(SET.start),todayD());if(d<0)return 0;return Math.min(TOTAL()+1,Math.floor(d/7)+1)}
const key=(w,sid)=>`${w}-${sid}`;
const rxOf=(rx,w)=>Array.isArray(rx)?rx[wip(w)]:rx;
const BIRTH={cs:'C-section',vag:'Vaginal birth',unknown:'Not set'};

const isPro=()=>SET.level==='returning';
const RPE_PRO={1:'RPE 6–7',2:'RPE 7–8',3:'RPE 7–8',4:'RPE 8'};
const rpeOf=p=>isPro()?RPE_PRO[p.n]:p.rpe;
const PRO={
 1:{boxsquat:['goblet',null,'8–14 kg'],kbdl:[null,null,'12–20 kg'],dbrdl:[null,null,'8–12 kg each hand']},
 2:{goblet:['bsquat',['3×8','4×6','4×6','4×6'],'Start at 50–60% of your pre-pregnancy weights'],dbbench:['bbench',['3×8','4×6','4×6','4×6'],'50–60% of pre-pregnancy weights'],kbdl:['bdl',['3×6','3×6','4×5','4×5'],'50–60% of pre-pregnancy weights'],ssq:['rfess',null,null],stepup:['sldl',['3×8 /side','3×8 /side','3×10 /side','3×10 /side'],null]},
 3:{goblet:['bdl',['4×5','4×5','5×4','3×5'],'Build toward 70–80% of pre-pregnancy weights'],inclinepush:['pushup','1×8','Floor push-ups, only if no doming'],stepup:['sldl',null,'Heavier dumbbell']},
 4:{kbdl:['bdl',['4×5','5×4','5×3','3×5'],'Heaviest lift of the program'],inclinepush:['pushup','2×8','Floor push-ups']}
};
const bump=rx=>Array.isArray(rx)?rx.map(bump):String(rx).replace(/^2×/,'3×').replace(/^3×(\d+)( |$)/,(m,r,e)=>+r>=8?`4×${r}${e}`:m);
function adaptItem(it,n,bn){
  let id=it[0];let t=0;
  if(isPro()){
    const sw=PRO[n]&&PRO[n][id];
    if(sw){if(sw[0])id=sw[0];it=[id,sw[1]||it[1],sw[2]||it[2]];t=1}
    if(bn==='Main'&&!/^@/.test(id)){const nb=bump(it[1]);if(JSON.stringify(nb)!==JSON.stringify(it[1])){it=[id,nb,it[2]];t=1}}
  }
  if(isCS()){
    if(id==='plank'&&n===1)return {id:'heelslide',rx:['2×8 /side','3×8 /side','3×10 /side','3×10 /side'],note:'Replaces the plank: a gentler core start after a C-section',t:1};
    if(id==='plank'&&n===2)return {id,rx:it[1],note:'From the knees until phase 3',t:1};
    if(id==='deadbug'&&n===1)return {id,rx:it[1],note:'Heel taps only for all of phase 1',t:1};
  }
  return {id,rx:it[1],note:it[2]||'',t};
}
function blocksFor(p,s){
  return s.blocks.map(b=>{
    const items=b.items.map(it=>adaptItem(it,p.n,b.n));
    if(b.n==='Warm-up'){
      if(isVag()&&!items.some(i=>i.id==='pflift'))items.unshift({id:'pflift',rx:p.n<=2?'10 quick flicks':'5 × 10 s holds',note:'Added: pelvic floor first after a vaginal birth',t:1});
      if(isCS()&&p.n<=2&&s.id==='A')items.push({id:'@cs',rx:'2–3 min',note:'Scar mobility, once healed and cleared',t:1});
    }
    return {n:b.n,items};
  });
}
const SCAR=['plank','sideplank','inclinepush','pallof','deadbug','hipthrust','kbswing','pullup','heelslide','bbench','dbbench'];
function exNote(id){
  if(isCS()&&SCAR.includes(id))return 'After a C-section: stop if you feel pulling, burning or pain at the scar, and switch to the easier version.';
  if(isVag()&&['kbswing','pogo'].includes(id))return 'After a vaginal birth: stop if you feel heaviness, leaking, or pain at a tear or stitches. Go back to deadlifts or marching on the spot.';
  if(isVag()&&id==='bike')return 'If the saddle presses on tender stitches or a tear, use a padded seat or switch to the cross-trainer.';
  if(isVag()&&['pflift','breath'].includes(id))return 'A key exercise for you. Pelvic floor recovery matters most after a vaginal birth.';
  return '';
}
function gateFor(p){
  const g=[...p.gate];
  if(p.n===1&&isCS())g.push('Scar comfortable in daily life, with no pulling during core work');
  if(p.n===1&&isVag())g.push('Pelvic floor: 10 × 10 s holds and 10 quick flicks, done easily');
  if(p.n===3&&isVag())g.push('No perineal or stitch pain during squats and lunges');
  return g;
}

function vSession(n,sid,w){
  const p=PH[n-1];const s=p.S.find(x=>x.id===sid);w=+w;const L=LOG[key(w,sid)];const feel=feelToday();
  const amb=feel==='a',red=feel==='r';
  const adj=rx=>{if(!amb)return rx;const m=String(rx).match(/^(\d)×(.*)$/);return m&&+m[1]>1?`${+m[1]-1}×${m[2]}`:rx};
  const blocks=blocksFor(p,s);
  return `${hdr(`Week ${w} · Session ${sid}`,true)}
  <div class="view stack" style="${pc(n)}">
  <section class="band"><span class="lbl">Phase ${n} · ${p.name}</span><h1>${s.name}</h1>
    <div class="facts"><span><b>${s.dur}</b> min</span><span><b>${blocks.reduce((a,b)=>a+b.items.length,0)}</b> exercises</span><span>${rpeOf(p)}</span></div></section>
  ${segTabs('swk',String(w),phWeeks(n).map(x=>[String(x),'W'+x]))}
  ${amb?`<div class="note warn"><b>Tired day:</b> main sets are already reduced by one. Stop 1–2 reps earlier.</div>`:''}

    if(it.id[0]==='@'){const k=it.id.slice(1);const a=LEARN[k];return `<button class="li tap" data-nav="article|${k}"><span class="thumb ico-t">${licon(a.ic,22)}</span><span class="grow"><span class="t">${k==='impact'?'Return-to-impact test':'Scar care'} ${it.t?tailoredTag:''}</span><span class="s">${esc(it.note)}</span></span><span class="rx">${rxOf(it.rx,w)}</span></button>`}
    const e=EX[it.id];return `<button class="li tap" data-nav="ex|${it.id}|${n}|${sid}|${w}|${bi}|${ix}">${thumb(it.id)}<span class="grow"><span class="t">${e.n} ${it.t?tailoredTag:''}</span><span class="s">${it.note?esc(it.note):esc(e.eq)}</span></span><span class="rx">${b.n==='Main'?adj(rxOf(it.rx,w)):rxOf(it.rx,w)}</span></button>`}).join('')}</div></div>`).join('')}
  <p class="muted" style="font-size:13px;padding:0 2px">Rest ${n<=2?'60–90 s':'90 s–2 min'} between sets · exhale on every effort · <button class="ul" data-nav="article|rpe">what "3×10" means</button></p>
  <div id="logbox">${L?logged(L,w,sid):`<button class="btn" data-act="openlog">Log this session</button>`}</div>
  </div>`;
}
function logged(L,w,sid){

function logForm(){

function exPanel(id){
  const e=EX[id];const t=S.exTab;

    <button class="linkrow tap" data-nav="article|red">${ico('alert')}<span class="grow">Stop signs<small>When to adapt or get checked</small></span>${I.chev}</button>`;
  if(t==='adjust')return `<div class="adj"><span class="lbl">Easier</span><p>${e.reg}</p></div><div class="adj"><span class="lbl">Harder</span><p>${e.prog}</p></div>
    <button class="linkrow tap" data-nav="article|load">${ico('up')}<span class="grow">When to add weight<small>Simple progression rules</small></span>${I.chev}</button>`;
  if(t==='about'){
    const used=[];PH.forEach(ph=>ph.S.forEach(s=>blocksFor(ph,s).forEach(b=>b.items.forEach(x=>{if(x.id===id)used.push({ph,s})}))));
    return `<h3>Why it helps after birth</h3><p>${e.why}</p>
    <h3>Muscles</h3><div class="chips">${e.mus.map(m=>`<span class="chip">${m}</span>`).join('')}</div>
    ${used.length?`<h3>In the program</h3><div class="list flat">${used.map(u=>`<button class="li tap" data-nav="session|${u.ph.n}|${u.s.id}|${phStart(u.ph.n)}"><span class="dot" style="background:var(--p${u.ph.n})"></span><span class="grow"><span class="t">Phase ${u.ph.n} · ${u.s.name}</span></span>${I.chev}</button>`).join('')}</div>`:''}

  }
  return `<ol class="steps">${e.cues.map(x=>`<li>${x}</li>`).join('')}</ol><div class="adj"><span class="lbl">Breathing</span><p>${e.br}</p></div>`;

/* =========================================================
   RENDER / NAV
   ========================================================= */
const app=document.getElementById('app');
const cur=()=>S.stack.length?S.stack[S.stack.length-1]:[S.tab];
function render(scrollTop){
  stopAnim();
  const v=cur();const t=v[0];let h='';
  if(t==='today')h=vToday();else if(t==='plan')h=vPlan();else if(t==='lib')h=vLib();else if(t==='learn')h=vLearn();
  else if(t==='phase')h=vPhase(+v[1],v[2]);else if(t==='week')h=vWeek(+v[1]);else if(t==='session')h=vSession(+v[1],v[2],v[3]);
  else if(t==='ex')h=vEx(v[1],v[2]?+v[2]:0,v[3],v[4],v[5],v[6]);else if(t==='article')h=vArticle(v[1]);else if(t==='settings')h=vSettings();
  app.innerHTML=h;renderTabs();drawThumbs();
  if(t==='ex')startAnim(v[1]);
  if(scrollTop)window.scrollTo(0,0);
  onScroll();
}
function renderTabs(){
  const tabs=[['today','Today',I.today],['plan','Program',I.plan],['lib','Exercises',I.lib],['learn','Learn',I.learn]];
  document.getElementById('tabs').innerHTML=tabs.map(([k,l,ic])=>`<button data-tab="${k}" aria-current="${S.tab===k}">${ic}<span>${l}</span></button>`).join('');
}
function drawThumbs(){document.querySelectorAll('canvas[data-thumb]').forEach(cv=>{const e=EX[cv.dataset.thumb];if(!e)return;try{drawScene(cv,e,e.f[0].d*0.85)}catch(err){}})}
let raf=0,paused=false,speed=1,acc=0,last=0;
function stopAnim(){cancelAnimationFrame(raf);raf=0}
function startAnim(id){
  const e=EX[id];const cv=document.getElementById('stage');if(!cv)return;
  paused=window.matchMedia('(prefers-reduced-motion: reduce)').matches;acc=0;last=performance.now();
  const ppb=document.getElementById('ppb');if(ppb)ppb.innerHTML=paused?I.play:I.pause;
  const cue=document.getElementById('cue');const dots=[...document.querySelectorAll('#dots i')];let lastSeg=-1;
  const tick=now=>{if(!paused)acc+=(now-last)*speed;last=now;const r=drawScene(cv,e,acc,{guides:S.guides});
    if(r.seg!==lastSeg){lastSeg=r.seg;cue.innerHTML=`${e.f[r.seg].lab}<small>${e.br}</small>`;dots.forEach((d,i)=>d.classList.toggle('on',i===r.seg))}
    raf=requestAnimationFrame(tick)};
  raf=requestAnimationFrame(tick);
}
function nav(str){
  const a=str.split('|');
  if(a[0]==='replace'){S.stack.pop();S.stack.push(a.slice(1));render(false);return}
  if(a[0]==='ex')S.exTab='how';
  if(a[0]==='phase')S.phTab=a[2]||'over';
  S.stack.push(a);render(true);
}
function pressSeg(attr,val){document.querySelectorAll(`[data-${attr}]`).forEach(b=>b.setAttribute('aria-pressed',b.dataset[attr]===val))}
document.addEventListener('click',ev=>{
  const el=ev.target.closest('[data-nav],[data-tab],[data-act],[data-feel],[data-cat],[data-deliv],[data-setdeliv],[data-setlevel],[data-level],[data-extab],[data-phtab],[data-wk],[data-swk]');if(!el)return;
  const d=el.dataset;
  if(d.nav){ev.preventDefault();nav(d.nav);return}
  if(d.tab){S.tab=d.tab;S.stack=[];render(true);return}
  if(d.feel){const k=iso(todayD());FEEL[k]=FEEL[k]===d.feel?null:d.feel;store.set('pp.feel',FEEL);render(false);return}
  if(d.cat){S.libCat=d.cat;render(false);return}
  if(d.setdeliv){if(d.setdeliv!=='skip')SET.delivery=d.setdeliv;SET.asked=true;store.set('pp.set',SET);render(false);return}
  if(d.setlevel){if(d.setlevel!=='skip')SET.level=d.setlevel;SET.askedLevel=true;store.set('pp.set',SET);render(false);return}
  if(d.level){SET.level=d.level;SET.askedLevel=true;store.set('pp.set',SET);render(false);return}
  if(d.deliv){SET.delivery=d.deliv;SET.asked=true;store.set('pp.set',SET);render(false);return}
  if(d.extab){S.exTab=d.extab;pressSeg('extab',d.extab);document.getElementById('expanel').innerHTML=exPanel(EXCTX.id);return}
  if(d.phtab){S.phTab=d.phtab;pressSeg('phtab',d.phtab);document.getElementById('phpanel').innerHTML=phPanel(+cur()[1]);return}
  if(d.wk){nav('replace|week|'+d.wk);return}
  if(d.swk){const v=cur();nav(`replace|session|${v[1]}|${v[2]}|${d.swk}`);return}
  const act=d.act;
  if(act==='back'){S.stack.pop();render(true)}
  else if(act==='pp'){paused=!paused;el.innerHTML=paused?I.play:I.pause;el.setAttribute('aria-label',paused?'Play':'Pause')}
  else if(act==='guides'){S.guides=!S.guides;el.setAttribute('aria-pressed',S.guides);const lg=document.getElementById('glegend');if(lg)lg.hidden=!S.guides}
  else if(act==='speed'){speed=speed===1?0.5:1;el.textContent=speed===1?'1×':'½×'}
  else if(act==='openlog'){document.getElementById('logbox').innerHTML=logForm();const r=document.getElementById('rpe');r.addEventListener('input',()=>document.getElementById('rpev').textContent=r.value)}
  else if(act==='unlog'){delete LOG[d.k];store.set('pp.log',LOG);render(false)}
  else if(act==='reset'){if(d.armed){LOG={};store.set('pp.log',LOG);render(false)}else{d.armed='1';el.textContent='Tap again to clear everything'}}
});
document.addEventListener('change',ev=>{const g=ev.target.dataset&&ev.target.dataset.gate;if(g){GATE[g]=ev.target.checked;store.set('pp.gate',GATE);document.getElementById('phpanel').innerHTML=phPanel(+cur()[1])}});
document.addEventListener('submit',ev=>{
  ev.preventDefault();
  if(ev.target.id==='logform'){const v=cur();const sym=[...document.querySelectorAll('input[name=sym]:checked')].map(x=>x.value);
    LOG[key(v[3],v[2])]={date:iso(todayD()),rpe:+document.getElementById('rpe').value,sym};store.set('pp.log',LOG);render(false)}
  if(ev.target.id==='setform'){const b=document.getElementById('s-birth').value,s=document.getElementById('s-start').value;if(b)SET.birth=b;if(s)SET.start=s;store.set('pp.set',SET);S.stack.pop();render(true)}
});
document.addEventListener('input',ev=>{if(ev.target.id==='q'){S.q=ev.target.value;const pos=ev.target.selectionStart;render(false);const q=document.getElementById('q');q.focus();try{q.setSelectionRange(pos,pos)}catch(e){}}});
function onScroll(){const h=document.getElementById('hdr');if(h)h.classList.toggle('scrolled',window.scrollY>4)}
window.addEventListener('scroll',onScroll,{passive:true});
window.matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change',()=>drawThumbs());
new MutationObserver(()=>drawThumbs()).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});
render(false);
</script>
<script>if('serviceWorker' in navigator){addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}</script>
</body>
